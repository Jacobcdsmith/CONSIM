<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CONSIM - Interactive Multiversal Consciousness Framework Visualization">
    <meta name="author" content="Jacob C. Smith">
    <title>CONSIM - Multiversal Consciousness Framework</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Main Canvas (Background Layer) -->
    <canvas id="canvas" aria-label="Consciousness field visualization"></canvas>

    <!-- UI Container (Prevents Overlaps) -->
    <div class="ui-container">

        <!-- Left Column -->
        <div class="ui-column ui-column-left">
            <!-- Info Panel -->
            <aside class="panel panel-info">
                <header class="panel-header">
                    <div class="logo">
                        <span class="logo-icon">🧠</span>
                        <div class="logo-text">
                            <h1>CONSIM</h1>
                            <p class="tagline">Multiversal Consciousness</p>
                        </div>
                    </div>
                </header>

                <section class="panel-body">
                    <div class="equation-display">
                        <div class="equation-label">Core Equation</div>
                        <div class="equation">
                            <div class="eq-line">C = ∫<sub>M<sub>C</sub></sub> A(x) Φ(x) e<sup>iτ(x)</sup> dμ(x)</div>
                            <div class="eq-line">M = Σ<sub>i</sub> λ<sub>i</sub> U<sub>i</sub></div>
                        </div>
                    </div>

                    <div class="stats-grid">
                        <div class="stat-item">
                            <span class="stat-label">Nodes</span>
                            <span class="stat-value" id="nodeCount">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Clusters</span>
                            <span class="stat-value" id="clusterCount">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Resonance</span>
                            <span class="stat-value" id="resonance">0.000</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Attention</span>
                            <span class="stat-value" id="attention">0.000</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Phase</span>
                            <span class="stat-value" id="phase">0.0°</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">FPS</span>
                            <span class="stat-value" id="fps">0</span>
                        </div>
                    </div>
                </section>
            </aside>
        </div>

        <!-- Right Column -->
        <div class="ui-column ui-column-right">
            <!-- Controls Panel -->
            <aside class="panel panel-controls">
                <section class="panel-section">
                    <h3 class="section-title">Physics</h3>
                    <div class="control-group">
                        <div class="control-item">
                            <label class="control-label">
                                <span>Gravity</span>
                                <span class="control-value" id="gravityValue">1.0</span>
                            </label>
                            <input type="range" id="gravitySlider" class="slider"
                                   min="0" max="2" step="0.1" value="1.0"
                                   aria-label="Gravity control">
                        </div>
                        <div class="control-item">
                            <label class="control-label">
                                <span>Friction</span>
                                <span class="control-value" id="frictionValue">0.99</span>
                            </label>
                            <input type="range" id="frictionSlider" class="slider"
                                   min="0.9" max="1" step="0.01" value="0.99"
                                   aria-label="Friction control">
                        </div>
                        <div class="control-item">
                            <label class="control-label">
                                <span>Time Dilation</span>
                                <span class="control-value" id="timeValue">1.0</span>
                            </label>
                            <input type="range" id="timeSlider" class="slider"
                                   min="0.1" max="2" step="0.1" value="1.0"
                                   aria-label="Time dilation control">
                        </div>
                        <div class="control-item">
                            <label class="control-label">
                                <span>Field Strength</span>
                                <span class="control-value" id="fieldValue">1.0</span>
                            </label>
                            <input type="range" id="fieldSlider" class="slider"
                                   min="0.2" max="3" step="0.1" value="1.0"
                                   aria-label="Field strength control">
                        </div>
                    </div>
                </section>

                <section class="panel-section">
                    <h3 class="section-title">Interaction</h3>
                    <div class="button-grid">
                        <button class="btn btn-mode active" data-mode="push" aria-pressed="true">
                            <span class="btn-icon">👋</span>
                            <span>Push</span>
                        </button>
                        <button class="btn btn-mode" data-mode="pull" aria-pressed="false">
                            <span class="btn-icon">🧲</span>
                            <span>Pull</span>
                        </button>
                        <button class="btn btn-mode" data-mode="vortex" aria-pressed="false">
                            <span class="btn-icon">🌀</span>
                            <span>Vortex</span>
                        </button>
                        <button class="btn btn-mode" data-mode="wave" aria-pressed="false">
                            <span class="btn-icon">🌊</span>
                            <span>Wave</span>
                        </button>
                    </div>
                </section>

                <section class="panel-section">
                    <h3 class="section-title">Visualization</h3>
                    <div class="button-grid button-grid-small">
                        <button class="btn btn-viz active" data-viz="consciousness" aria-pressed="true">Consciousness</button>
                        <button class="btn btn-viz" data-viz="attention" aria-pressed="false">Attention</button>
                        <button class="btn btn-viz" data-viz="frequency" aria-pressed="false">Frequency</button>
                        <button class="btn btn-viz" data-viz="temporal" aria-pressed="false">Temporal</button>
                        <button class="btn btn-viz" data-viz="multiverse" aria-pressed="false">Multiverse</button>
                    </div>
                </section>

                <section class="panel-section">
                    <h3 class="section-title">Actions</h3>
                    <div class="button-stack">
                        <button id="collapseBtn" class="btn btn-action">
                            <span class="btn-icon">⚡</span>
                            <span>Quantum Collapse</span>
                        </button>
                        <button id="resetBtn" class="btn btn-action btn-secondary">
                            <span class="btn-icon">🔄</span>
                            <span>Reset Lattice</span>
                        </button>
                    </div>
                </section>
            </aside>
        </div>

        <!-- Bottom Bar -->
        <footer class="status-bar">
            <div class="status-indicator">
                <span class="status-dot" id="statusDot"></span>
                <span class="status-text" id="statusText">Initializing...</span>
            </div>
            <div class="status-info">
                <span>Click to spawn • Drag panels to move</span>
            </div>
            <button id="resetPanelsBtn" class="btn-reset-panels" title="Reset panel positions">
                <span>↺</span>
            </button>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"
            onerror="console.warn('Three.js failed to load')"></script>
    <script src="/static/js/consciousnessRenderer.js"></script>
    <script src="/static/js/app_demo.js"></script>
</body>
</html>
